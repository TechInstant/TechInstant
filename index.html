<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />

  <!-- Resolve the saved theme before first paint, so the page never flashes the
       wrong one. Must stay in sync with ThemeContext (key: techinstant_theme). -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('techinstant_theme') || 'dark';
        var dark = t === 'dark' ||
          (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'><rect width='32' height='32' rx='8' fill='%2305DF72'/><path d='M18 4L8 18H15L14 28L24 14H17L18 4Z' fill='%2309111E'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechInstant Build Smarter. Grow Faster.</title>
  <meta name="description"
    content="TechInstant builds SaaS products, AI-powered solutions and modern digital technology for individuals, businesses and organizations." />

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="TechInstant Build Smarter. Grow Faster." />
  <meta property="og:description"
    content="TechInstant builds SaaS products, AI-powered solutions and modern digital technology that solve real problems." />
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="TechInstant — Build Smarter. Grow Faster." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
</head>

<body
  class="antialiased selection:bg-emerald-500 selection:text-slate-950 min-h-screen">
  <div id="root"></div>

  <!--
    Netlify Forms declarations.

    Netlify detects forms by parsing the HTML it receives at build time, and this
    is a single-page app — the real forms are rendered by React and never appear
    here. So each one is declared once below, hidden, with every field it sends.
    React then POSTs url-encoded data with a matching `form-name` (see
    src/lib/submitForm.ts) and Netlify files the submission.

    Keep the field names in step with the React forms. A field that is missing
    here is silently dropped from the submission.

    Submissions appear in Netlify → Forms. Turn on email notification there to
    have them forwarded; it cannot be set from the code.
  -->
  <form name="project-brief" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="company" />
    <input type="text" name="projectType" />
    <input type="text" name="budget" />
    <input type="text" name="timeline" />
    <textarea name="description"></textarea>
    <input type="text" name="bot-field" />
  </form>

  <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
    <input type="email" name="email" />
    <input type="text" name="bot-field" />
  </form>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
